linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert
    - bodyclose
    - nilerr
    - errorlint

linters-settings:
  goimports:
    local-prefixes: github.com/robert-crandall/gh-pr-feedback
  misspell:
    locale: US
  errorlint:
    errorf: true

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
