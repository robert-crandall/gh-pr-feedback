name: Auto Tag and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch all history for all tags

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch  # Default to patch version
          # Use #major or #minor in commit messages to bump accordingly
          # Example: "feat: new feature #minor"
          # Example: "BREAKING CHANGE: api change #major"

      - name: Create release notes
        if: steps.tag_version.outputs.new_tag
        run: |
          echo "New tag created: ${{ steps.tag_version.outputs.new_tag }}"
          echo "Previous tag: ${{ steps.tag_version.outputs.previous_tag }}"
          echo "Changelog: ${{ steps.tag_version.outputs.changelog }}"
