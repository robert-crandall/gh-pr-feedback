# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: gh-pr-feedback

before:
  hooks:
    - go mod tidy

builds:
  - id: gh-pr-feedback
    main: .
    # Binary name must match: gh-EXTENSION-NAME-OS-ARCH for gh extension install
    binary: >-
      {{ .ProjectName }}-{{ .Os }}-{{ .Arch }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    format: binary
    # No archive wrapping - gh CLI expects raw binaries
    name_template: >-
      {{ .ProjectName }}-{{ .Os }}-{{ .Arch }}

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: robert-crandall
    name: gh-pr-feedback
  draft: false
  prerelease: auto
