# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: gh-pr-feedback

before:
  hooks:
    - go mod tidy

builds:
  - id: gh-pr-feedback
    main: .
    binary: gh-pr-feedback
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    format: tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: robert-crandall
    name: gh-pr-feedback
  draft: false
  prerelease: auto
